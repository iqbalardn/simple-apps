
# must be unique in a given SonarQube instance
sonar.projectKey=simple-apps

# Project information
sonar.projectName=simple-apps
sonar.projectVersion=1.0

# SonarQube server
sonar.host.url=http://172.23.13.88:9000

# Source and test files
sonar.sources=.
sonar.tests=testing/
sonar.test.inclusions=testing/**/*.test.js

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions from main source analysis
sonar.exclusions=**/node_modules/**,**/.scannerwork/**,**/coverage/**,**/dist/**,**/build/**,**/.next/**,**/out/**,testing/**/*.test.js

# Coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SCM
sonar.scm.exclusions.disabled=false
